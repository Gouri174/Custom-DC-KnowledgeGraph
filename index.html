<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>India Data Commons — Knowledge Graph Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f4f5f7; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; }
  header span { font-size: 12px; color: #888; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; }
  .controls { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .controls input[type=text] { flex: 1; min-width: 300px; padding: 8px 12px; font-size: 13px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; outline: none; }
  .controls input[type=text]:focus { border-color: #185FA5; }
  .controls label { font-size: 13px; color: #555; white-space: nowrap; }
  .controls input[type=range] { width: 100px; }
  .controls span.depth-val { font-size: 13px; font-weight: 600; color: #185FA5; min-width: 16px; }
  .controls button { padding: 8px 18px; font-size: 13px; font-weight: 500; background: #185FA5; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .controls button:hover { background: #0C447C; }
  .controls button.secondary { background: #fff; color: #185FA5; border: 1px solid #185FA5; }
  .controls button.secondary:hover { background: #E6F1FB; }
  .layout-btns { display: flex; gap: 6px; }
  .layout-btns button { padding: 6px 12px; font-size: 12px; background: #f0f0f0; color: #333; border: 1px solid #d0d0d0; border-radius: 5px; cursor: pointer; }
  .layout-btns button.on { background: #185FA5; color: #fff; border-color: #185FA5; }
  .status { font-size: 12px; color: #666; padding: 6px 24px; background: #fafafa; border-bottom: 1px solid #eee; min-height: 28px; }
  #graph-wrap { flex: 1; position: relative; min-height: 600px; }
  #graph-net { width: 100%; height: 100%; min-height: 600px; }
  .legend { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95); border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #555; }
  .leg { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .info-panel { position: absolute; top: 10px; right: 10px; max-width: 340px; background: rgba(255,255,255,0.97); border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 14px; font-size: 12px; display: none; line-height: 1.7; white-space: pre-wrap; word-break: break-all; max-height: 80vh; overflow-y: auto; }
  .info-panel.show { display: block; }
  .info-panel strong { color: #185FA5; display: block; margin-bottom: 6px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>India Data Commons — Knowledge Graph Explorer</h1>
  <span>indiadatacommons.org</span>
</header>
<div class="controls">
  <input type="text" id="dcid-input"
    placeholder="Enter DCID e.g. RealValue_Amount_EconomicActivity_GrossValueAdded_MOSPIOtherService"
    value="RealValue_Amount_EconomicActivity_GrossValueAdded_MOSPIOtherService"/>
  <label>Max depth</label>
  <input type="range" id="depth-slider" min="1" max="5" value="5" step="1"
    oninput="document.getElementById('depth-val').textContent=this.value"/>
  <span class="depth-val" id="depth-val">5</span>
  <button onclick="loadGraph()">Visualize</button>
  <div class="layout-btns">
    <button id="btn-h" class="on" onclick="setLayout('h')">Hierarchical</button>
    <button id="btn-f" onclick="setLayout('f')">Force</button>
    <button class="secondary" onclick="fitView()">Fit view</button>
  </div>
</div>
<div class="status" id="status">Enter a DCID and click Visualize</div>
<div id="graph-wrap">
  <div id="graph-net"></div>
  <div class="legend">
    <div style="font-size:10px;color:#999;margin-bottom:6px;letter-spacing:.4px">NODE TYPES</div>
    <div class="leg"><div class="leg-dot" style="background:#185FA5"></div> STAT_VAR</div>
    <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div> ENUM</div>
    <div class="leg"><div class="leg-dot" style="background:#0F6E56"></div> CONCEPT</div>
    <div class="leg"><div class="leg-dot" style="background:#5F5E5A"></div> PROPERTY</div>
    <div class="leg"><div class="leg-dot" style="background:#BA7517"></div> PLACE</div>
    <div class="leg"><div class="leg-dot" style="background:#00d4aa"></div> OBSERVATION</div>
    <div style="font-size:10px;color:#bbb;margin-top:8px">Click node for details</div>
  </div>
  <div class="info-panel" id="info-panel">
    <strong id="info-title"></strong>
    <span id="info-body"></span>
  </div>
</div>

<script>
let STATIC_GRAPH = null;
let network = null;
let currentLayout = 'h';
let lastVisNodes = [], lastVisEdges = [];

const TYPE_STYLE = {
  STAT_VAR:    { color: '#185FA5', size: 26, shape: 'diamond' },
  ENUM:        { color: '#1D9E75', size: 14, shape: 'dot' },
  CONCEPT:     { color: '#0F6E56', size: 14, shape: 'ellipse' },
  PROPERTY:    { color: '#5F5E5A', size: 11, shape: 'box' },
  STAT_TYPE:   { color: '#444441', size: 11, shape: 'box' },
  PLACE:       { color: '#BA7517', size: 16, shape: 'star' },
  OBSERVATION: { color: '#00d4aa', size: 12, shape: 'square' },
  DEFAULT:     { color: '#7F77DD', size: 12, shape: 'dot' }
};

function getHOpts() {
  return {
    layout: { hierarchical: { direction: 'LR', sortMethod: 'directed', levelSeparation: 220, nodeSpacing: 70, treeSpacing: 150 } },
    physics: { enabled: false },
    edges: { smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.4 }, arrows: { to: { enabled: true, scaleFactor: 0.6 } } },
    nodes: { borderWidth: 2 },
    interaction: { hover: true, tooltipDelay: 60, keyboard: true }
  };
}

function getFOpts() {
  return {
    layout: { hierarchical: false },
    physics: { solver: 'barnesHut', barnesHut: { gravitationalConstant: -14000, centralGravity: 0.4, springLength: 200, springConstant: 0.04, damping: 0.1 }, maxVelocity: 50, minVelocity: 0.1, stabilization: { iterations: 400 } },
    edges: { smooth: { type: 'dynamic' }, arrows: { to: { enabled: true, scaleFactor: 0.6 } } },
    nodes: { borderWidth: 2 },
    interaction: { hover: true, tooltipDelay: 60, keyboard: true }
  };
}

async function loadGraph() {
  const maxDepth = parseInt(document.getElementById('depth-slider').value);
  setStatus('Loading...');

  if (!STATIC_GRAPH) {
    try {
      const res = await fetch('idc_graph_v5.json');
      if (!res.ok) throw new Error('Could not load idc_graph_v5.json');
      STATIC_GRAPH = await res.json();
    } catch(e) {
      setStatus('Error: ' + e.message);
      return;
    }
  }

  const allNodes = STATIC_GRAPH.nodes || [];
  const allEdges = STATIC_GRAPH.edges || [];

  const filteredNodes = allNodes.filter(n => (n.level || 0) <= maxDepth);
  const filteredIds = new Set(filteredNodes.map(n => n.id));
  const filteredEdges = allEdges.filter(e => filteredIds.has(e.from) && filteredIds.has(e.to));

  lastVisNodes = filteredNodes.map(n => {
    const s = TYPE_STYLE[n.type] || TYPE_STYLE.DEFAULT;
    return {
      id: n.id,
      label: (n.label || n.id).replace(/\\n/g, '\n'),
      title: n.tooltip || n.id,
      level: n.level || 0,
      color: { background: s.color, border: s.color, highlight: { background: '#fff', border: s.color } },
      size: s.size,
      shape: s.shape,
      font: { color: '#1a1a1a', size: 11, multi: false }
    };
  });

  lastVisEdges = filteredEdges.map((e, i) => ({
    id: i, from: e.from, to: e.to, label: e.prop,
    arrows: 'to',
    color: { color: '#aaa', highlight: '#555' },
    font: { color: '#666', size: 9, strokeWidth: 0 },
    width: 1.5
  }));

  renderNetwork();
  setStatus('Loaded — ' + filteredNodes.length + ' nodes, ' + filteredEdges.length + ' edges · Source: indiadatacommons.org');
}

function renderNetwork() {
  const container = document.getElementById('graph-net');
  const data = { nodes: new vis.DataSet(lastVisNodes), edges: new vis.DataSet(lastVisEdges) };
  if (network) network.destroy();
  network = new vis.Network(container, data, currentLayout === 'h' ? getHOpts() : getFOpts());
  network.on('click', params => {
    const panel = document.getElementById('info-panel');
    if (params.nodes.length) {
      const n = lastVisNodes.find(x => x.id === params.nodes[0]);
      if (n) {
        document.getElementById('info-title').textContent = (n.label || n.id).replace(/\n/g, ' ');
        document.getElementById('info-body').textContent = n.title || '';
        panel.classList.add('show');
      }
    } else { panel.classList.remove('show'); }
  });
  network.on('stabilizationIterationsDone', () => network.fit());
  setTimeout(() => network.fit(), 400);
}

function setLayout(mode) {
  currentLayout = mode;
  document.getElementById('btn-h').classList.toggle('on', mode === 'h');
  document.getElementById('btn-f').classList.toggle('on', mode === 'f');
  if (lastVisNodes.length) renderNetwork();
}

function fitView() { if (network) network.fit(); }
function setStatus(t) { document.getElementById('status').textContent = t; }
document.getElementById('dcid-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadGraph(); });
</script>
</body>
</html>
